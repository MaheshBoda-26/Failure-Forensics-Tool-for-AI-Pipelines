name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly live-model smoke (Monday 06:00 UTC), bounded spend
  workflow_dispatch: {}  # manual trigger for live tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck, Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # optional extras we exercise in CI
          pip install -e ".[postgres,otel]"

      - name: Run make check
        run: make check

  postgres:
    name: PostgreSQL backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forensics
          POSTGRES_PASSWORD: forensics  # pragma: allowlist secret
          POSTGRES_DB: forensics
        ports: [55432:5432]
        options: >-
          --health-cmd="pg_isready -U forensics"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      FORENSICS_TEST_POSTGRES_URL: postgresql://forensics:forensics@127.0.0.1:55432/forensics  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 55432 -U forensics && break
            sleep 2
          done

      - name: Run PostgreSQL tests
        run: make test-postgres

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  live-tests:
    name: Live model tests (weekly + manual)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # Bounded spend so a weekly smoke cannot drain quota: one document at a few
      # cents per run, and a global ceiling well under a dollar per week.
      SPEND_CAP_PER_RUN_USD: "0.05"
      SPEND_CAP_GLOBAL_USD: "0.20"
      # One labelled document; invoice_001 is what the live smoke test runs.
      LIVE_TEST_DOC_ID: invoice_001
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run live smoke test
        run: |
          pytest -m live -v --tb=short \
            -k "contract_001 or invoice_001" \
            || pytest -m live -v --tb=short -k "invoice_001"

      - name: Upload live trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-trace-${{ github.run_id }}
          path: data/traces/*.json
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## Live-model smoke" >> $GITHUB_STEP_SUMMARY
          echo "Document: \`${LIVE_TEST_DOC_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "Per-run cap: \${SPEND_CAP_PER_RUN_USD} USD · Global cap: \${SPEND_CAP_GLOBAL_USD} USD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Traces written to \`data/traces/\` (uploaded as artifact above)." >> $GITHUB_STEP_SUMMARY
          echo "Model, tokens, cost and root cause are recorded on each trace span." >> $GITHUB_STEP_SUMMARY
