[project]
name = "forensics"
version = "0.1.0"
description = "Failure forensics tool for multi-step AI pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "typer>=0.27",
    "streamlit>=1.38",
    "plotly>=5.20",
    # Required, not optional: `forensics.auth` is imported by `forensics.api`
    # and `forensics.cli`, so the package cannot be imported without it.
    "bcrypt>=4.1",
    # Same reasoning (spec 06): the scheduled eval and its SQLite-backed job
    # store are core features; `SQLAlchemyJobStore` needs SQLAlchemy.
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
otel = [
    "opentelemetry-exporter-otlp>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Opt-in PostgreSQL backend (`DATABASE_URL`). Not in the default install: SQLite
# is the shipped default, and `StorageBase` keeps the two interchangeable.
postgres = [
    "asyncpg>=0.29",
]

[project.scripts]
forensics = "forensics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: makes real NVIDIA NIM API calls; deselect with -m 'not live'",
    "postgres: requires a live PostgreSQL server (FORENSICS_TEST_POSTGRES_URL)",
    "deselect with -m 'not postgres'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forensics"]
mypy_path = "src"
warn_unreachable = true

# APScheduler ships no type information (no `py.typed`, no stubs on PyPI), so
# strict mode cannot analyse it. Its objects are real at runtime; the few values
# that reach typed code are annotated explicitly at the boundary.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

# OTLP export is a genuine optional extra: `make install` pulls it in, but the
# package must typecheck and import without it (the import is lazy inside
# `otel_export._create_exporter`, and a missing exporter degrades to
# "not configured"). A per-module override is required instead of a
# `type: ignore` on the import line, because that ignore would be reported as
# unused — and fail strict mode — once the extra *is* installed.
[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true

# `asyncpg` is the opt-in `postgres` extra, so it is absent from a default
# install by design. The backend is imported lazily through the storage factory
# and must typecheck without the driver present.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
