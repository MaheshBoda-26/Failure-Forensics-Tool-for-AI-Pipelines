# Render blueprint for Failure Forensics.
#
# One web service serves both halves: `forensics.api:app` answers the JSON API and
# mounts the compiled React UI from `frontend/dist` (the mount is skipped when the
# directory is absent, so a build without Node still starts and serves the API).
#
# The persistent disk is what makes the demo survive a redeploy: it holds the
# SQLite index (`forensics.db`), the per-trace JSON payloads, the LLM response
# cache, the spend ledger, and the APScheduler job store.
#
# Two things to know before deploying:
#
#   * Disks are not available on the free plan. `plan: starter` is declared
#     *because* the `disk:` block below requires it; on the free plan, delete the
#     `disk:` block and accept an ephemeral filesystem (then re-seed the demo with
#     `POST /pipeline/run-demo` after every restart).
#   * The disk cannot be mounted at the repository's own `data/`, because a
#     build recreates the checkout. It is mounted at `/var/data` and the output
#     paths are pointed there instead, which is the same guarantee.
services:
  - type: web
    name: failure-forensics
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: >-
      pip install --upgrade pip &&
      pip install ".[otel]" &&
      cd frontend && npm ci && npm run build
    # `seed` loads the committed real-model traces into the disk before serving,
    # so a fresh instance's UI shows real traces and diagnoses rather than an
    # empty database. It is idempotent, so restarts do not duplicate rows.
    startCommand: python -m forensics.cli seed && uvicorn forensics.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Everything the app writes goes to the disk.
      - key: DATA_DIR
        value: /var/data
      - key: TRACES_DIR
        value: /var/data/traces
      - key: CACHE_DIR
        value: /var/data/cache
      - key: DB_PATH
        value: /var/data/forensics.db
      - key: SCHEDULER_DB_PATH
        value: /var/data/scheduler.db
      - key: SPEND_FILE
        value: /var/data/spend.json

      # Secrets: set these in the Render dashboard, never in git.
      - key: NVIDIA_API_KEY
        sync: false

      # Model configuration. Required, not optional: `Settings` validates that
      # every role has an id, a provider and a family, and the app exits during
      # lifespan startup without them. The `.env` that holds these locally is
      # gitignored, so it never reaches Render — only `NVIDIA_API_KEY` is not
      # enough, and a deploy that sets only that fails to boot.
      - key: PIPELINE_MODEL_ID
        value: minimaxai/minimax-m3.1-flash
      - key: PIPELINE_MODEL_PROVIDER
        value: minimaxai
      - key: PIPELINE_MODEL_FAMILY
        value: minimaxai
      - key: PIPELINE_FALLBACK_MODEL_ID
        value: minimaxai/minimax-m3.1-flash
      - key: PIPELINE_FALLBACK_MODEL_PROVIDER
        value: minimaxai
      - key: PIPELINE_FALLBACK_MODEL_FAMILY
        value: minimaxai
      - key: JUDGE_MODEL_ID
        value: meta/llama-3.1-8b-instruct
      - key: JUDGE_MODEL_PROVIDER
        value: meta
      - key: JUDGE_MODEL_FAMILY
        value: meta
      - key: CHEAP_MODEL_ID
        value: nvidia/nemotron-3.5-content-safety
      - key: CHEAP_MODEL_PROVIDER
        value: nvidia
      - key: CHEAP_MODEL_FAMILY
        value: nvidia

      # Prices stay 0.0 until real ones are filled in, so `total_cost_usd`
      # reports 0 (docs/limitations.md §10). Declared explicitly rather than
      # omitted so the zero is visibly a decision, not a missing value.
      - key: PIPELINE_MODEL_PRICE_IN
        value: "0.0"
      - key: PIPELINE_MODEL_PRICE_OUT
        value: "0.0"

      # Deliberate, and identical to `.env.example`: the pipeline and its
      # fallback share the one slug verified against NIM, and this switch also
      # gates the duplicate-model-id guard, so `true` would abort startup.
      - key: JUDGE_FAMILY_SEPARATION_REQUIRED
        value: "false"

      # Defaults on purpose. Auth off keeps the public demo open and the queue off
      # keeps runs inline — a queued job needs a worker service to consume it.
      - key: AUTH_ENABLED
        value: "false"
      - key: QUEUE_ENABLED
        value: "false"

      # Empty schedule = no nightly eval. Set a cron (e.g. "0 2 * * *") together
      # with ALERT_WEBHOOK_URL to enable regression alerting; the instance must
      # stay running for the job to fire.
      - key: EVAL_SCHEDULE
        value: ""
      - key: EVAL_SCHEDULE_TIMEZONE
        value: UTC
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_WEBHOOK_SECRET
        sync: false

      # Uncomment to run the demo without spending NIM quota.
      # - key: DRY_RUN
      #   value: "true"
    disk:
      name: forensics-data
      mountPath: /var/data
      sizeGB: 1
